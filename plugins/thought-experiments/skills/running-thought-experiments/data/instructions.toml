# Short instructions te next shows for the current stage, and reviewer lenses for te brief.
# Each text: English, imperative, with its reason. Keep each under 600 characters (check_limits.py).

[show]
define-terms = "Restate the question in one line and define each term the argument rests on, saying which reading you took. If a term enters a formula, define it by the formula: a prose definition and a formula drifted apart in a real run."
value-checks = "Before the rivals: search papers, official reports and decision records for the favourite and its opposite (te source add, prior_answer). Name who actually holds the view you will attack (holder). Write what an informed practitioner expects, as probabilities (prediction). Rebuilding a known answer or refuting a view nobody holds wastes the run."
rivals = "List three or more rivals, including the opposite of the favourite. For each, write what result would make you drop it (would_reject_if) before you operate, so the result cannot be read to fit. Add a holder for every rival you may weaken. Fields of any event: te schema <kind>."
probe = "Vary one condition and say which rivals the outcome favours. Keep it provisional; give no overall verdict yet."
operate = "State what is fixed, idealised away and varied. Vary one thing per operation; sweep to find where the verdict flips. Record verdicts per rival. Put every computation in scripts/ writing to $TE_OUTPUTS, run te run, and cite outputs/ instead of pasting numbers."
group-differences = "Before reading a difference between groups as a cause, check that the groups are measured the same way. A real run blamed a missing factor that one group already included."
independent-attack = "Do not attack your own result. After the draft conclusion, run te brief for two or three lenses, give each brief to a fresh subagent (not a fork: a fork inherits your anchoring), save each reply with te brief --record-response, and record an attack event per reviewer."
conclude = "Judge every objection with a response (surrender, bar, restrict, reinterpret, incorporate) and a reason. Give the conclusion as premises with labels and citations; mark the rival you adopt (answer_rival). Use only facts checked against primary sources as empirical-checked; for an absence, record the searches (premise.searched). Update rival verdicts the attack changes (attack.verdicts). Fetch documents with te source add, not by hand into other folders."
compare-prediction = "Run te score for the Brier score of the stage A prediction (none if no rival is adopted: compare in words). A result that matches the prediction confirms an existing view; say so, and say what, if anything, is new."
review = "Record whether the result departs from the prediction, who would change their mind, and what is new (review). Then close the record."

[[lens]]
id = "practitioner"
text = "You are a practitioner who makes this kind of decision. Judge whether the claim would survive contact with real constraints, documents and incentives."

[[lens]]
id = "method"
text = "You are a methodologist. Check definitions against formulas, the logic of each inference, statistics, and whether each operation varied only one thing."

[[lens]]
id = "outsider"
text = "You are an intelligent outsider to the field. Point out hidden assumptions, terms used loosely, and conclusions that read as obvious or as already known."
